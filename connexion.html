<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Pokéslay – Collection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <section class="bg-bar py-5 px-4">
    <div class="container is-fluid">
      <div class="level is-mobile">

        <div class="level-left">
          <a href="index.html" class="button is-rounded bg-pill">
            <span class="icon"><i class="fa-solid fa-power-off"></i></span>
            <span>Déconnexion</span>
          </a>
        </div>

        <div class="level-item">
          <div class="is-flex is-align-items-center">
            <figure class="image is-64x64 mr-4">
              <img src="img/pokeball.png" alt="Pokéball">
            </figure>
            <div class="button is-rounded bg-pill is-size-3 px-6">
              Pokéslay
            </div>
          </div>
        </div>

        <div class="level-right">
          <a href="#" class="button is-rounded bg-pill">
            <span class="icon"><i class="fa-solid fa-rectangle-list"></i></span>
            <span>Collection</span>
          </a>
        </div>

      </div>
    </div>
  </section>

  <section class="section pt-5 pb-6">
    <div class="container is-fluid px-6">

      <div class="columns is-vcentered mb-6">
        <div class="column">
          <div class="button is-rounded bg-pill is-size-5 px-5" style="border:0;width:100%;justify-content:flex-start;">
            Bienvenue, merci de vous êtes connecté
          </div>
        </div>

        <div class="column is-4">
          <div class="columns is-mobile is-vcentered is-gapless">

            <div class="column">
              <div class="button is-rounded bg-pill is-size-5 px-5">
                <span>Recherche</span>
                <span class="icon"><i class="fa-solid fa-magnifying-glass"></i></span>
              </div>
            </div>

          </div>
        </div>
      </div>

      <div class="columns is-vcentered is-gapless is-centered">

        <div class="column is-3 has-text-centered">
          <a href="carapuce.html" class="is-block">
            <div class="card bg-card soft-radius-more">
              <div class="card-content py-6">
                <figure class="image is-128x128 is-inline-block">
                  <img src="img/carapuce.jpg.png" alt="carapuce">
                </figure>
              </div>
            </div>
            <div class="button is-rounded bg-pill mt-4 px-6">carapuce</div>
          </a>


          <div class="buttons is-centered mt-3">
            <button class="button is-rounded bg-pill js-add" data-item="carapuce">
              <span class="icon"><i class="fa-solid fa-plus"></i></span>
              <span>Ajouter</span>
            </button>
            <button class="button is-rounded bg-pill js-remove" data-item="carapuce" disabled>
              <span class="icon"><i class="fa-solid fa-minus"></i></span>
              <span>Supprimer</span>
            </button>
          </div>
        </div>

        <div class="column is-1 has-text-centered">
          <figure class="image is-48x48 is-inline-block">
            <img src="img/pokeball.png" alt="Pokéball">
          </figure>
        </div>

        <div class="column is-3 has-text-centered">
          <a href="salameche.html" class="is-block">
            <div class="card bg-card soft-radius-more">
              <div class="card-content py-6">
                <figure class="image is-128x128 is-inline-block">
                  <img src="img/salameche.jpg.png" alt="salameche">
                </figure>
              </div>
            </div>
            <div class="button is-rounded bg-pill mt-4 px-6">salameche</div>
          </a>

          <div class="buttons is-centered mt-3">
            <button class="button is-rounded bg-pill js-add" data-item="salameche">
              <span class="icon"><i class="fa-solid fa-plus"></i></span>
              <span>Ajouter</span>
            </button>
            <button class="button is-rounded bg-pill js-remove" data-item="salameche" disabled>
              <span class="icon"><i class="fa-solid fa-minus"></i></span>
              <span>Supprimer</span>
            </button>
          </div>
        </div>

        <div class="column is-1 has-text-centered">
          <figure class="image is-48x48 is-inline-block">
            <img src="img/pokeball.png" alt="Pokéball">
          </figure>
        </div>

        <div class="column is-3 has-text-centered">
          <a href="fantominus.html" class="is-block">
            <div class="card bg-card soft-radius-more">
              <div class="card-content py-6">
                <figure class="image is-128x128 is-inline-block">
                  <img src="img/fantominus.jpg.png" alt="fantominus">
                </figure>
              </div>
            </div>
            <div class="button is-rounded bg-pill mt-4 px-6">fantominus</div>
          </a>

          <div class="buttons is-centered mt-3">
            <button class="button is-rounded bg-pill js-add" data-item="fantominus">
              <span class="icon"><i class="fa-solid fa-plus"></i></span>
              <span>Ajouter</span>
            </button>
            <button class="button is-rounded bg-pill js-remove" data-item="fantominus" disabled>
              <span class="icon"><i class="fa-solid fa-minus"></i></span>
              <span>Supprimer</span>
            </button>
          </div>
        </div>

      </div>

      <div class="columns is-vcentered is-gapless is-centered mt-6">

        <div class="column is-3 has-text-centered">
          <a href="bulbizarre.html" class="is-block">
            <div class="card bg-card soft-radius-more">
              <div class="card-content py-6">
                <figure class="image is-128x128 is-inline-block">
                  <img src="img/bulbizarre.jpg.png" alt="bulbizarre">
                </figure>
              </div>
            </div>
            <div class="button is-rounded bg-pill mt-4 px-6">bulbizarre</div>
          </a>

          <div class="buttons is-centered mt-3">
            <button class="button is-rounded bg-pill js-add" data-item="bulbizarre">
              <span class="icon"><i class="fa-solid fa-plus"></i></span>
              <span>Ajouter</span>
            </button>
            <button class="button is-rounded bg-pill js-remove" data-item="bulbizarre" disabled>
              <span class="icon"><i class="fa-solid fa-minus"></i></span>
              <span>Supprimer</span>
            </button>
          </div>
        </div>

        <div class="column is-1 has-text-centered">
          <figure class="image is-48x48 is-inline-block">
            <img src="img/pokeball.png" alt="Pokéball">
          </figure>
        </div>

        <div class="column is-3 has-text-centered">
          <a href="pichu.html" class="is-block">
            <div class="card bg-card soft-radius-more">
              <div class="card-content py-6">
                <figure class="image is-128x128 is-inline-block">
                  <img src="img/pichu.webp" alt="pichu">
                </figure>
              </div>
            </div>
            <div class="button is-rounded bg-pill mt-4 px-6">pichu</div>
          </a>

          <div class="buttons is-centered mt-3">
            <button class="button is-rounded bg-pill js-add" data-item="pichu">
              <span class="icon"><i class="fa-solid fa-plus"></i></span>
              <span>Ajouter</span>
            </button>
            <button class="button is-rounded bg-pill js-remove" data-item="pichu" disabled>
              <span class="icon"><i class="fa-solid fa-minus"></i></span>
              <span>Supprimer</span>
            </button>
          </div>
        </div>

        <div class="column is-1 has-text-centered">
          <figure class="image is-48x48 is-inline-block">
            <img src="img/pokeball.png" alt="Pokéball">
          </figure>
        </div>

        <div class="column is-3 has-text-centered">
          <a href="osselait.html" class="is-block">
            <div class="card bg-card soft-radius-more">
              <div class="card-content py-6">
                <figure class="image is-128x128 is-inline-block">
                  <img src="img/osselait.jpg.png" alt="osselait">
                </figure>
              </div>
            </div>
            <div class="button is-rounded bg-pill mt-4 px-6">osselait</div>
          </a>

          <div class="buttons is-centered mt-3">
            <button class="button is-rounded bg-pill js-add" data-item="osselait">
              <span class="icon"><i class="fa-solid fa-plus"></i></span>
              <span>Ajouter</span>
            </button>
            <button class="button is-rounded bg-pill js-remove" style="border:0;" data-item="osselait" disabled>
              <span class="icon"><i class="fa-solid fa-minus"></i></span>
              <span>Supprimer</span>
            </button>
          </div>
        </div>

      </div>

    </div>
  </section>

  <footer class="bg-bar py-5 px-5">
    <div class="container is-fluid">
      <div class="columns is-vcentered is-mobile">

        <div class="column has-text-centered">
          <span class="icon mr-2"><i class="fab fa-youtube"></i></span>
          @OfficialPokémonTV
        </div>

        <div class="column has-text-centered">
          <span class="icon mr-2"><i class="fab fa-instagram"></i></span>
          @Pokémon
        </div>

        <div class="column has-text-centered">
          <span class="icon mr-2"><i class="fab fa-facebook-f"></i></span>
          @Pokémon
        </div>

        <div class="column is-narrow">
          <figure class="image is-64x64">
            <img src="img/pokeball.png" alt="Pokéball">
          </figure>
        </div>

      </div>
    </div>
  </footer>
</body>

</html>
