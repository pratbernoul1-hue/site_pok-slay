<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Pokéslay – Bulbizarre</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="stylessalamèche.css">
</head>

<body class="page">

    <section class="bg-bar py-5 px-4">
        <div class="container is-fluid">
            <div class="level is-mobile">

                <div class="level-left">
                    <a href="index.html" class="button is-rounded bg-pill">
                        <span class="icon"><i class="fa-solid fa-house"></i></span>
                        <span>Accueil</span>
                    </a>
                </div>

                <div class="level-item">
                    <div class="is-flex is-align-items-center">
                        <figure class="image is-64x64 mr-4">
                            <img src="img/pokeball.png">
                        </figure>
                        <div class="button is-rounded bg-pill is-size-3 px-6">
                            Pokéslay
                        </div>
                    </div>
                </div>

                <div class="level-right">
                    <a href="connexion.html" class="button is-rounded bg-pill">
                        <span class="icon"><i class="fa-solid fa-rectangle-list"></i></span>
                        <span>Collection</span>
                    </a>
                </div>

            </div>
        </div>
    </section>

    <div class="app-divider"></div>

    <section class="section pt-6 page-content">
        <div class="container is-fluid px-6">

            <div class="columns is-variable is-8 is-vcentered">

                <div class="column is-5">
                    <div class="box app-card p-6">
                        <img src="img/salameche.jpg.png">
                    </div>
                </div>

                <div class="column is-7 is-flex is-flex-direction-column" style="gap:18px;">

                    <div class="app-pill app-pill-title px-5 py-3 is-flex is-align-items-center">
                        <img src="img/rouge.png" class="mr-3" width="34">
                        <span class="is-size-2">salamèche</span>
                    </div>

                    <div class="app-pill px-5 py-3 is-flex is-align-items-center">
                        <img src="img/rouge.png" class="mr-3" width="30">
                        Type : Feu
                    </div>
                    <div class="app-pill px-5 py-3 is-flex is-align-items-center">
                        <img src="img/rouge.png" class="mr-3" width="30">
                        PV : 70
                    </div>

                    <div class="app-pill px-5 py-3 is-flex is-align-items-center">
                        <img src="img/rouge.png" class="mr-3" width="30">
                        Pouvoir : Destruction Ardente, Crachage de Feu Régulier
                    </div>

                    <div class="app-pill px-5 py-3 is-flex is-align-items-center">
                        <img src="img/rouge.png" class="mr-3" width="30">
                        Taille : 0,6 m – Poids : 8,5 kg
                    </div>

                    <div class="app-pill px-5 py-3 is-flex is-align-items-center">
                        <img src="img/rouge.png" class="mr-3" width="30">Faiblesse :
                        <img src="img/bleu.png" width="32">
                        x2
                    </div>

                </div>
            </div>

            <div class="columns is-centered is-vcentered mt-5">

                <div class="column is-2 has-text-centered">
                    <div class="box app-card p-4">
                        <img src="img/salameche.jpg.png">
                    </div>
                    <div class="button is-rounded bg-pill mt-3">salamèche</div>
                </div>

                <div class="column is-narrow">
                    <img src="img/fleche.png" width="70">
                </div>

                <div class="column is-2 has-text-centered">
                    <div class="box app-card p-4">
                        <img src="img/reptincel.jpg.png">
                    </div>
                    <div class="button is-rounded bg-pill mt-3">reptincel</div>
                </div>

                <div class="column is-narrow">
                    <img src="img/fleche.png" width="70">
                </div>

                <div class="column is-2 has-text-centered">
                    <div class="box app-card p-4">
                        <img src="img/dracaufeu.jpg.png">
                    </div>
                    <div class="button is-rounded bg-pill mt-3">dracaufeu</div>
                </div>

            </div>

        </div>
    </section>

    <footer class="bg-bar py-5 px-5">
        <div class="container is-fluid">
            <div class="columns is-vcentered is-mobile">

                <div class="column has-text-centered">
                    <i class="fab fa-youtube mr-2"></i>@OfficialPokémonTV
                </div>

                <div class="column has-text-centered">
                    <i class="fab fa-instagram mr-2"></i>@Pokémon
                </div>

                <div class="column has-text-centered">
                    <i class="fab fa-facebook-f mr-2"></i>@Pokémon
                </div>

                <div class="column is-narrow">
                    <img src="img/pokeball.png" width="56">
                </div>

            </div>
        </div>
    </footer>

</html>
